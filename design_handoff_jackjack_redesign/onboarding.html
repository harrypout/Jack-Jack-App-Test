<!-- @dsCard group="Mobile App" viewport="900x860" name="Onboarding — before & after" subtitle="Audit: stale old-app screenshots + generic copy → fresh in-brand previews. Right phone is interactive." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jack Jack — Onboarding</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg); font-family: var(--font-body); color: var(--color-slate); -webkit-font-smoothing: antialiased; }
  .stage { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 44px 20px; }
  .cols { display: flex; gap: 56px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .tag { font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 5px 12px; border-radius: var(--radius-full); }
  .tag.before { color: var(--color-coral); background: var(--coral-10); }
  .tag.after { color: var(--color-sage); background: var(--sage-10); }
  .cap { font-size: 12.5px; color: var(--slate-60); max-width: 260px; text-align: center; line-height: 1.5; }
  @keyframes jjpulse { from { transform: scale(.7); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  @keyframes jjfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel" src="frame.jsx"></script>
<script type="text/babel" src="onboarding.jsx"></script>
<script type="text/babel">
  function App() {
    const [done, setDone] = React.useState(false);
    return (
      <div className="stage">
        <div className="cols">
          <div className="col">
            <span className="tag before">Before · shipped</span>
            <window.Phone><window.LegacyOnboardingScreen /></window.Phone>
            <div className="cap">Generic “Sound Sensing App” copy and a photo screenshot of the old app baked in as <code>onboarding0–2.png</code>.</div>
          </div>
          <div className="col">
            <span className="tag after">After · proposed</span>
            <window.Phone>
              {done
                ? <window.MonitorScreen onSettings={() => {}} />
                : <window.OnboardingScreen onDone={() => setDone(true)} />}
            </window.Phone>
            <div className="cap">Warm, product-specific copy and live previews of the current Jack Jack screens — no stale screenshots. Try Continue.</div>
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
