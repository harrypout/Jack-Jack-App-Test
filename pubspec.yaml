name: jackjack
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.13
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.0
  syncfusion_flutter_gauges: ^30.2.5
  timeago: ^3.7.1
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.4.0
  device_info_plus: ^11.5.0
  fluttertoast: ^8.2.12
  skeletonizer: ^2.1.0+1
  flutter_launcher_icons: ^0.14.4
  just_audio: ^0.10.4
  audio_session: ^0.2.2
  uuid: ^4.5.1
  disable_battery_optimization: ^1.1.2
  url_launcher: ^6.3.2

  # Background service support
  flutter_background_service: ^5.0.10
  flutter_background_service_android: ^6.2.7
  flutter_background_service_ios: ^5.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.5
  build_runner: ^2.5.4
  custom_lint: ^0.7.6
  riverpod_lint: ^2.6.5

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/
    - assets/pngs/
    - .env

flutter_launcher_icons:
  image_path_android: "assets/pngs/jackjack_android.png"
  image_path_ios: "assets/pngs/jackjack_android.png"
  android: "launcher_icon"
  adaptive_icon_background: "#FCF9F2"
  adaptive_icon_foreground: "assets/pngs/jackjack_android.png"
  ios: true
  min_sdk_android: 21
