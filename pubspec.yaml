name: ble
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  syncfusion_flutter_gauges: ^28.2.6
  timeago: ^3.2.2
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^11.4.0
  flutter_local_notifications: ^19.1.0
  device_info_plus: ^11.4.0
  fluttertoast: ^8.2.12
  skeletonizer: ^1.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4

flutter:
