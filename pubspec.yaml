name: jackjack
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.5.2
  google_fonts: ^6.2.1
  syncfusion_flutter_gauges: ^28.2.6
  timeago: ^3.2.2
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^11.4.0
  flutter_local_notifications: ^19.1.0
  device_info_plus: ^11.4.0
  fluttertoast: ^8.2.12
  skeletonizer: ^1.4.3
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15
  custom_lint: ^0.7.3
  riverpod_lint: ^2.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/svgs/
    - assets/pngs/
    - .env

flutter_launcher_icons:
#  image_path: "assets/pngs/icon1024.png"
  image_path_android: "assets/pngs/jackjack_android.png"
  image_path_ios: "assets/pngs/jackjack_android.png"
  android: "launcher_icon"
  adaptive_icon_background: "#FCF9F2"
  adaptive_icon_foreground: "assets/pngs/jackjack_android.png"
#  android: true # can specify file name here e.g. "ic_launcher"
  ios: true # can specify file name here e.g. "My-Launcher-Icon"
#  adaptive_icon_background: "assets/images/christmas-background.png" # only available for Android 8.0 devices and above
#  adaptive_icon_foreground: "assets/images/icon-foreground-432x432.png" # only available for Android 8.0 devices and above
#  adaptive_icon_foreground_inset: 16 # only available for Android 8.0 devices and above
#  adaptive_icon_monochrome: "assets/images/icon-monochrome-432x432.png" # only available for Android 13 devices and above
  min_sdk_android: 21 # android min sdk min:16, default 21
#  remove_alpha_ios: true
#  background_color_ios: "#ffffff"